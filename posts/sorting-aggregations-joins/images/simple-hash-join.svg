<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker>
  </defs>

  <!-- BUILD -->
  <text x="20" y="22" font-weight="bold" fill="#555">PHASE 1: BUILD. Scan the smaller table R and insert every tuple.</text>
  <g stroke="#4a78c2" stroke-width="2" fill="#e6f0ff">
    <rect x="30" y="40" width="54" height="26"/><rect x="90" y="40" width="54" height="26"/><rect x="150" y="40" width="54" height="26"/><rect x="210" y="40" width="54" height="26"/>
    <rect x="30" y="72" width="54" height="26"/><rect x="90" y="72" width="54" height="26"/><rect x="150" y="72" width="54" height="26"/>
  </g>
  <g text-anchor="middle" font-weight="bold" font-size="13">
    <text x="57" y="58">600</text><text x="117" y="58">200</text><text x="177" y="58">100</text><text x="237" y="58">300</text>
    <text x="57" y="90">500</text><text x="117" y="90">700</text><text x="177" y="90">400</text>
  </g>
  <text x="20" y="116" font-size="12" fill="#555">R tuples (join key shown)</text>

  <line x1="270" y1="76" x2="298" y2="76" stroke="#777" stroke-width="2" marker-end="url(#a)"/>
  <rect x="300" y="62" width="70" height="28" rx="6" fill="#fffbe6" stroke="#b8860b" stroke-width="2"/>
  <text x="335" y="81" text-anchor="middle" font-weight="bold">h1</text>
  <text x="300" y="108" font-size="11" fill="#555">h1(k) = (k / 100) mod 4</text>
  <line x1="372" y1="76" x2="418" y2="76" stroke="#777" stroke-width="2" marker-end="url(#a)"/>

  <!-- hash table -->
  <text x="420" y="34" font-size="12" font-weight="bold" fill="#2f8f4e">Hash table on R</text>
  <g stroke="#2f8f4e" stroke-width="2" fill="#f3fbf3">
    <rect x="420" y="40" width="36" height="36"/><rect x="420" y="80" width="36" height="36"/><rect x="420" y="120" width="36" height="36"/><rect x="420" y="160" width="36" height="36"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#2f8f4e">
    <text x="438" y="63">0</text><text x="438" y="103">1</text><text x="438" y="143">2</text><text x="438" y="183">3</text>
  </g>
  <g stroke="#4a78c2" stroke-width="2" fill="#e6f0ff">
    <rect x="466" y="44" width="52" height="28"/>
    <rect x="466" y="84" width="52" height="28"/><rect x="536" y="84" width="52" height="28"/>
    <rect x="466" y="124" width="52" height="28"/><rect x="536" y="124" width="52" height="28"/>
    <rect x="466" y="164" width="52" height="28"/><rect x="536" y="164" width="52" height="28"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold">
    <text x="492" y="63">400</text>
    <text x="492" y="103">100</text><text x="562" y="103">500</text>
    <text x="492" y="143">600</text><text x="562" y="143">200</text>
    <text x="492" y="183">300</text><text x="562" y="183">700</text>
  </g>
  <g stroke="#777" stroke-width="1.5" marker-end="url(#a)">
    <line x1="518" y1="98" x2="534" y2="98"/><line x1="518" y1="138" x2="534" y2="138"/><line x1="518" y1="178" x2="534" y2="178"/>
  </g>

  <!-- PROBE -->
  <line x1="20" y1="214" x2="800" y2="214" stroke="#ccc" stroke-dasharray="6 6"/>
  <text x="20" y="238" font-weight="bold" fill="#555">PHASE 2: PROBE. Stream the larger table S and look each tuple up.</text>
  <g stroke="#2f8f4e" stroke-width="2" fill="#e3f6e3">
    <rect x="30" y="256" width="54" height="26"/><rect x="90" y="256" width="54" height="26"/><rect x="150" y="256" width="54" height="26"/>
  </g>
  <g text-anchor="middle" font-weight="bold" font-size="13">
    <text x="57" y="274">100</text><text x="117" y="274">900</text><text x="177" y="274">200</text>
  </g>
  <text x="20" y="302" font-size="12" fill="#555">S tuples</text>
  <line x1="210" y1="269" x2="298" y2="269" stroke="#777" stroke-width="2" marker-end="url(#a)"/>
  <rect x="300" y="255" width="70" height="28" rx="6" fill="#fffbe6" stroke="#b8860b" stroke-width="2"/>
  <text x="335" y="274" text-anchor="middle" font-weight="bold">h1</text>
  <line x1="372" y1="262" x2="440" y2="200" stroke="#777" stroke-width="2" marker-end="url(#a)"/>
  <text x="380" y="300" font-size="12" fill="#555">jump to the bucket, then compare keys</text>

  <rect x="620" y="86" width="180" height="104" rx="8" fill="#f3fbf3" stroke="#2f8f4e" stroke-width="2"/>
  <g font-size="13" fill="#333">
    <text x="632" y="108" font-weight="bold" fill="#2f8f4e">Results</text>
    <text x="632" y="128">100: in bucket 1, equal,</text><text x="632" y="144">emit</text>
    <text x="632" y="164">900: bucket 1, no equal</text><text x="632" y="180">key, no output</text>
  </g>
  <text x="20" y="326" font-size="13" fill="#333">200: bucket 2, equal, emit. Landing in a bucket is only a hint; the keys are always compared.</text>
</svg>
