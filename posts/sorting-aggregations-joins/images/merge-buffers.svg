<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>

  <text x="20" y="28" font-weight="bold" fill="#555">Disk: sorted runs</text>
  <text x="240" y="28" font-weight="bold" fill="#555">Buffer pool (B = 4)</text>
  <text x="700" y="28" font-weight="bold" fill="#555">Disk</text>

  <!-- disk runs -->
  <g font-size="12" fill="#555">
    <text x="20" y="62">run A</text><text x="20" y="142">run B</text><text x="20" y="222">run C</text>
  </g>
  <g stroke="#4a78c2" stroke-width="2" fill="#e6f0ff">
    <rect x="20" y="70" width="72" height="36"/><rect x="100" y="70" width="72" height="36" fill="#f4f8ff" stroke-dasharray="4 3"/>
    <rect x="20" y="150" width="72" height="36"/><rect x="100" y="150" width="72" height="36" fill="#f4f8ff" stroke-dasharray="4 3"/>
    <rect x="20" y="230" width="72" height="36"/><rect x="100" y="230" width="72" height="36" fill="#f4f8ff" stroke-dasharray="4 3"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#333">
    <text x="56" y="93">1  5</text><text x="136" y="93" fill="#888">8  9</text>
    <text x="56" y="173">2  3</text><text x="136" y="173" fill="#888">6  7</text>
    <text x="56" y="253">4  10</text><text x="136" y="253" fill="#888">11 12</text>
  </g>

  <!-- arrows disk -> input buffers -->
  <g stroke="#777" stroke-width="1.8" marker-end="url(#a)">
    <line x1="176" y1="88" x2="236" y2="88"/><line x1="176" y1="168" x2="236" y2="168"/><line x1="176" y1="248" x2="236" y2="248"/>
  </g>

  <!-- input buffers -->
  <g stroke="#2f8f4e" stroke-width="2" fill="#e3f6e3">
    <rect x="240" y="70" width="36" height="36"/><rect x="276" y="70" width="36" height="36"/>
    <rect x="240" y="150" width="36" height="36"/><rect x="276" y="150" width="36" height="36"/>
    <rect x="240" y="230" width="36" height="36"/><rect x="276" y="230" width="36" height="36"/>
  </g>
  <!-- consumed keys greyed, current head highlighted -->
  <rect x="240" y="70" width="36" height="36" fill="#eee" stroke="#aaa" stroke-width="2"/>
  <rect x="240" y="150" width="36" height="36" fill="#eee" stroke="#aaa" stroke-width="2"/>
  <rect x="276" y="150" width="36" height="36" fill="#ffd9b3" stroke="#c2410c" stroke-width="3"/>
  <g text-anchor="middle" font-size="15">
    <text x="258" y="94" fill="#999" text-decoration="line-through">1</text><text x="294" y="94">5</text>
    <text x="258" y="174" fill="#999" text-decoration="line-through">2</text><text x="294" y="174" font-weight="bold" fill="#c2410c">3</text>
    <text x="258" y="254">4</text><text x="294" y="254">10</text>
  </g>
  <g font-size="12" fill="#555">
    <text x="320" y="92">input buffer 1</text><text x="320" y="172">input buffer 2</text><text x="320" y="252">input buffer 3</text>
  </g>

  <!-- merge box -->
  <rect x="440" y="120" width="130" height="100" rx="8" fill="#fffbe6" stroke="#b8860b" stroke-width="2"/>
  <g text-anchor="middle" font-size="13" fill="#333">
    <text x="505" y="152" font-weight="bold">merge</text>
    <text x="505" y="172">smallest head key</text>
    <text x="505" y="190">of the 3 inputs</text>
  </g>
  <g stroke="#777" stroke-width="1.6" marker-end="url(#a)">
    <line x1="312" y1="92" x2="438" y2="140"/>
    <line x1="312" y1="252" x2="438" y2="200"/>
  </g>
  <line x1="312" y1="168" x2="438" y2="168" stroke="#c2410c" stroke-width="2.5" marker-end="url(#o)"/>
  <text x="372" y="160" font-size="12" fill="#c2410c" font-weight="bold">next: 3</text>

  <!-- output buffer -->
  <line x1="572" y1="170" x2="606" y2="170" stroke="#777" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="610" y="152" width="36" height="36" fill="#e3f6e3" stroke="#2f8f4e" stroke-width="2"/>
  <rect x="646" y="152" width="36" height="36" fill="#e3f6e3" stroke="#2f8f4e" stroke-width="2"/>
  <g text-anchor="middle" font-size="15"><text x="628" y="176">1</text><text x="664" y="176">2</text></g>
  <text x="610" y="146" font-size="12" fill="#555">output buffer (full)</text>

  <!-- flush -->
  <line x1="684" y1="170" x2="700" y2="170" stroke="#777" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="704" y="140" width="100" height="60" rx="6" fill="#fafafa" stroke="#999" stroke-width="2"/>
  <g text-anchor="middle" font-size="12" fill="#333">
    <text x="754" y="166">longer sorted</text><text x="754" y="183">run, written</text><text x="754" y="198" font-size="11" fill="#777">page by page</text>
  </g>

  <!-- notes -->
  <line x1="20" y1="292" x2="800" y2="292" stroke="#ddd"/>
  <g font-size="13" fill="#333">
    <text x="20" y="316">1. One buffer page per input run, plus one output page: merging B - 1 runs needs B buffers in total.</text>
    <text x="20" y="338">2. Emit the smallest head key (1, 2 already written; 3 is next), then advance that run's cursor.</text>
    <text x="20" y="360">3. Input page exhausted? Read that run's next page. Output page full? Write it out and reuse it.</text>
    <text x="20" y="382" fill="#c2410c" font-weight="bold">Every page is read once and written once per pass, always sequentially.</text>
  </g>
</svg>
