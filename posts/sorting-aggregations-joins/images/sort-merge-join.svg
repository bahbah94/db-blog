<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14">
  <text x="60" y="30" font-weight="bold" fill="#555">R (sorted by id)</text>
  <text x="360" y="30" font-weight="bold" fill="#555">S (sorted by id)</text>

  <!-- match lines -->
  <g stroke-width="2.5" fill="none">
    <line x1="160" y1="65" x2="360" y2="65" stroke="#2f8f4e"/>
    <line x1="160" y1="65" x2="360" y2="105" stroke="#2f8f4e"/>
    <line x1="160" y1="105" x2="360" y2="145" stroke="#2f8f4e"/>
    <line x1="160" y1="145" x2="360" y2="145" stroke="#c2410c" stroke-dasharray="7 4"/>
    <line x1="160" y1="225" x2="360" y2="185" stroke="#2f8f4e"/>
    <line x1="160" y1="265" x2="360" y2="225" stroke="#2f8f4e"/>
  </g>

  <!-- R column -->
  <g stroke-width="2">
    <rect x="60" y="50" width="100" height="30" fill="#e6f0ff" stroke="#4a78c2"/>
    <rect x="60" y="90" width="100" height="30" fill="#e6f0ff" stroke="#4a78c2"/>
    <rect x="60" y="130" width="100" height="30" fill="#ffd9b3" stroke="#c2410c"/>
    <rect x="60" y="170" width="100" height="30" fill="#f2f2f2" stroke="#aaa"/>
    <rect x="60" y="210" width="100" height="30" fill="#e6f0ff" stroke="#4a78c2"/>
    <rect x="60" y="250" width="100" height="30" fill="#e6f0ff" stroke="#4a78c2"/>
    <rect x="60" y="290" width="100" height="30" fill="#f2f2f2" stroke="#aaa"/>
    <rect x="60" y="330" width="100" height="30" fill="#f2f2f2" stroke="#aaa"/>
  </g>
  <g text-anchor="middle" font-weight="bold">
    <text x="110" y="71">100</text><text x="110" y="111">200</text><text x="110" y="151">200</text><text x="110" y="191" fill="#777">300</text>
    <text x="110" y="231">400</text><text x="110" y="271">500</text><text x="110" y="311" fill="#777">600</text><text x="110" y="351" fill="#777">700</text>
  </g>

  <!-- S column -->
  <g stroke="#2f8f4e" stroke-width="2" fill="#e3f6e3">
    <rect x="360" y="50" width="100" height="30"/><rect x="360" y="90" width="100" height="30"/><rect x="360" y="130" width="100" height="30"/>
    <rect x="360" y="170" width="100" height="30"/><rect x="360" y="210" width="100" height="30"/>
  </g>
  <g text-anchor="middle" font-weight="bold">
    <text x="410" y="71">100</text><text x="410" y="111">100</text><text x="410" y="151">200</text><text x="410" y="191">400</text><text x="410" y="231">500</text>
  </g>

  <!-- notes -->
  <g font-size="13" fill="#333">
    <text x="520" y="62" font-weight="bold" fill="#2f8f4e">Green: match, emit</text>
    <text x="520" y="82">R 100 matches both S 100s.</text>
    <text x="520" y="102">Each R/S page is read once.</text>

    <text x="520" y="142" font-weight="bold" fill="#c2410c">Orange: the only rewind</text>
    <text x="520" y="162">R has 200 twice. After the first 200,</text>
    <text x="520" y="180">S has moved past its 200, so S rewinds</text>
    <text x="520" y="198">to the start of its 200 group (the</text>
    <text x="520" y="216">"last value") for R's second 200.</text>

    <text x="520" y="256" font-weight="bold" fill="#777">Grey: no partner</text>
    <text x="520" y="276">R 300, 600, 700 are stepped over.</text>
    <text x="520" y="296">Nothing is compared against them</text>
    <text x="520" y="314">more than once.</text>
  </g>
</svg>
