<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a78c2"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7b3fb5"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>

  <text x="20" y="22" font-size="13" fill="#555">INSERT (each key sets 2 bits using 2 hash functions)</text>

  <!-- insert words -->
  <rect x="180" y="32" width="60" height="28" rx="14" fill="#e6f0ff" stroke="#4a78c2" stroke-width="2"/>
  <text x="210" y="51" text-anchor="middle" font-weight="bold">cat</text>
  <rect x="420" y="32" width="60" height="28" rx="14" fill="#f1e6fb" stroke="#7b3fb5" stroke-width="2"/>
  <text x="450" y="51" text-anchor="middle" font-weight="bold">dog</text>

  <g stroke="#4a78c2" stroke-width="2" marker-end="url(#b)">
    <line x1="210" y1="62" x2="238" y2="108"/>
    <line x1="215" y1="62" x2="476" y2="108"/>
  </g>
  <g stroke="#7b3fb5" stroke-width="2" marker-end="url(#p)">
    <line x1="445" y1="62" x2="362" y2="108"/>
    <line x1="455" y1="62" x2="538" y2="108"/>
  </g>
  <text x="102" y="98" font-size="11" fill="#555">cat -> bits 1, 5</text>
  <text x="640" y="98" font-size="11" fill="#555">dog -> bits 3, 6</text>

  <!-- bit array -->
  <g stroke="#555" stroke-width="2">
    <rect x="150" y="110" width="60" height="44" fill="#fff"/>
    <rect x="210" y="110" width="60" height="44" fill="#d6e4ff"/>
    <rect x="270" y="110" width="60" height="44" fill="#fff"/>
    <rect x="330" y="110" width="60" height="44" fill="#e3d4f5"/>
    <rect x="390" y="110" width="60" height="44" fill="#fff"/>
    <rect x="450" y="110" width="60" height="44" fill="#d6e4ff"/>
    <rect x="510" y="110" width="60" height="44" fill="#e3d4f5"/>
    <rect x="570" y="110" width="60" height="44" fill="#fff"/>
  </g>
  <g text-anchor="middle" font-size="10" fill="#888">
    <text x="180" y="123">0</text><text x="240" y="123">1</text><text x="300" y="123">2</text><text x="360" y="123">3</text>
    <text x="420" y="123">4</text><text x="480" y="123">5</text><text x="540" y="123">6</text><text x="600" y="123">7</text>
  </g>
  <g text-anchor="middle" font-weight="bold" font-size="18">
    <text x="180" y="146">0</text><text x="240" y="146">1</text><text x="300" y="146">0</text><text x="360" y="146">1</text>
    <text x="420" y="146">0</text><text x="480" y="146">1</text><text x="540" y="146">1</text><text x="600" y="146">0</text>
  </g>
  <text x="20" y="136" font-size="13" fill="#555">8-bit array</text>

  <line x1="20" y1="195" x2="740" y2="195" stroke="#ccc" stroke-dasharray="6 6"/>
  <text x="20" y="215" font-size="13" fill="#555">LOOKUP (check that ALL of the key's bits are 1)</text>

  <!-- lookup cow: bits 1,2 -->
  <g stroke="#c0392b" stroke-width="2" marker-end="url(#r)">
    <line x1="240" y1="250" x2="240" y2="158"/>
    <line x1="246" y1="250" x2="298" y2="158"/>
  </g>
  <rect x="210" y="252" width="60" height="28" rx="14" fill="#ffe9e9" stroke="#c0392b" stroke-width="2"/>
  <text x="240" y="271" text-anchor="middle" font-weight="bold">cow</text>
  <text x="240" y="302" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">bit 2 is 0</text>
  <text x="240" y="320" text-anchor="middle" font-size="13" fill="#c0392b">DEFINITELY not in the set</text>

  <!-- lookup emu: bits 3,5 -->
  <g stroke="#c2410c" stroke-width="2" marker-end="url(#o)">
    <line x1="415" y1="250" x2="362" y2="158"/>
    <line x1="425" y1="250" x2="478" y2="158"/>
  </g>
  <rect x="390" y="252" width="60" height="28" rx="14" fill="#fff0e0" stroke="#c2410c" stroke-width="2"/>
  <text x="420" y="271" text-anchor="middle" font-weight="bold">emu</text>
  <text x="560" y="302" text-anchor="middle" font-size="13" fill="#c2410c" font-weight="bold">bits 3 and 5 are both 1</text>
  <text x="560" y="320" text-anchor="middle" font-size="13" fill="#c2410c">"probably in the set" ... but emu was</text>
  <text x="560" y="338" text-anchor="middle" font-size="13" fill="#c2410c">never inserted: a FALSE POSITIVE</text>
</svg>
