<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14">
  <text x="190" y="18" text-anchor="middle" font-weight="bold">Trie (one letter per node)</text>
  <text x="680" y="18" text-anchor="middle" font-weight="bold">Radix tree (chains squashed)</text>
  <text x="450" y="440" text-anchor="middle" font-size="13" fill="#555">Keys stored: HELLO, HAT, HAVE.   Green = a key ends here.</text>
  <line x1="450" y1="30" x2="450" y2="415" stroke="#ddd" stroke-dasharray="6 6"/>

  <!-- ============ TRIE (left) ============ -->
  <g stroke="#4a78c2" stroke-width="1.8" fill="none">
    <line x1="190" y1="50"  x2="190" y2="84"/>
    <line x1="190" y1="116" x2="90"  y2="154"/>
    <line x1="190" y1="116" x2="280" y2="154"/>
    <line x1="90"  y1="186" x2="90"  y2="224"/>
    <line x1="90"  y1="256" x2="90"  y2="294"/>
    <line x1="90"  y1="326" x2="90"  y2="364"/>
    <line x1="280" y1="186" x2="230" y2="224"/>
    <line x1="280" y1="186" x2="330" y2="224"/>
    <line x1="330" y1="256" x2="330" y2="294"/>
  </g>
  <circle cx="190" cy="40" r="12" fill="#f0f0f0" stroke="#888" stroke-width="2"/>
  <g fill="#e6f0ff" stroke="#4a78c2" stroke-width="2">
    <circle cx="190" cy="100" r="16"/>
    <circle cx="90"  cy="170" r="16"/>
    <circle cx="280" cy="170" r="16"/>
    <circle cx="90"  cy="240" r="16"/>
    <circle cx="90"  cy="310" r="16"/>
    <circle cx="330" cy="240" r="16"/>
  </g>
  <g fill="#e3f6e3" stroke="#2f8f4e" stroke-width="3">
    <circle cx="90"  cy="380" r="16"/>
    <circle cx="230" cy="240" r="16"/>
    <circle cx="330" cy="310" r="16"/>
  </g>
  <g text-anchor="middle" font-weight="bold">
    <text x="190" y="106">H</text>
    <text x="90"  y="176">E</text>
    <text x="280" y="176">A</text>
    <text x="90"  y="246">L</text>
    <text x="90"  y="316">L</text>
    <text x="90"  y="386">O</text>
    <text x="230" y="246">T</text>
    <text x="330" y="246">V</text>
    <text x="330" y="316">E</text>
  </g>
  <text x="400" y="176" font-size="12" fill="#c2410c">shared prefix</text>
  <text x="400" y="192" font-size="12" fill="#c2410c">"HA" stored once</text>

  <!-- ============ RADIX (right) ============ -->
  <g stroke="#4a78c2" stroke-width="1.8" fill="none">
    <line x1="680" y1="52"  x2="680" y2="84"/>
    <line x1="680" y1="116" x2="570" y2="174"/>
    <line x1="680" y1="116" x2="780" y2="174"/>
    <line x1="780" y1="206" x2="720" y2="264"/>
    <line x1="780" y1="206" x2="840" y2="264"/>
  </g>
  <circle cx="680" cy="40" r="12" fill="#f0f0f0" stroke="#888" stroke-width="2"/>
  <rect x="662" y="84" width="36" height="32" rx="8" fill="#e6f0ff" stroke="#4a78c2" stroke-width="2"/>
  <text x="680" y="105" text-anchor="middle" font-weight="bold">H</text>

  <rect x="530" y="174" width="80" height="32" rx="8" fill="#e3f6e3" stroke="#2f8f4e" stroke-width="3"/>
  <text x="570" y="195" text-anchor="middle" font-weight="bold">ELLO</text>

  <rect x="762" y="174" width="36" height="32" rx="8" fill="#e6f0ff" stroke="#4a78c2" stroke-width="2"/>
  <text x="780" y="195" text-anchor="middle" font-weight="bold">A</text>

  <rect x="702" y="264" width="36" height="32" rx="8" fill="#e3f6e3" stroke="#2f8f4e" stroke-width="3"/>
  <text x="720" y="285" text-anchor="middle" font-weight="bold">T</text>
  <rect x="816" y="264" width="48" height="32" rx="8" fill="#e3f6e3" stroke="#2f8f4e" stroke-width="3"/>
  <text x="840" y="285" text-anchor="middle" font-weight="bold">VE</text>

  <text x="480" y="340" font-size="13" fill="#444">9 letter nodes (trie)  ->  5 nodes (radix tree) for the same keys.</text>
  <text x="480" y="360" font-size="13" fill="#444">A node with exactly one child is merged into its child.</text>
  <text x="480" y="380" font-size="13" fill="#444">Skipped letters are not checked on the way down, so the DBMS</text>
  <text x="480" y="398" font-size="13" fill="#444">verifies the full key against the tuple at the end.</text>
</svg>
