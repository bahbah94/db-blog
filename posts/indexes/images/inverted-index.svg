<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
  </defs>

  <!-- headings -->
  <text x="20"  y="22" font-weight="bold">Table (documents)</text>
  <text x="300" y="22" font-weight="bold">Dictionary</text>
  <text x="520" y="22" font-weight="bold">Posting lists (doc ids)</text>

  <!-- documents -->
  <g stroke="#4a78c2" stroke-width="2" fill="#e6f0ff">
    <rect x="20" y="40"  width="220" height="40" rx="6"/>
    <rect x="20" y="90"  width="220" height="40" rx="6"/>
    <rect x="20" y="140" width="220" height="40" rx="6"/>
    <rect x="20" y="190" width="220" height="40" rx="6"/>
  </g>
  <g font-size="13">
    <text x="32" y="65"><tspan font-weight="bold">1</tspan>  "the cat sat"</text>
    <text x="32" y="115"><tspan font-weight="bold">2</tspan>  "the dog sat"</text>
    <text x="32" y="165"><tspan font-weight="bold">3</tspan>  "cat and dog"</text>
    <text x="32" y="215"><tspan font-weight="bold">4</tspan>  "cat ran"</text>
  </g>
  <text x="20" y="252" font-size="12" fill="#555">split into terms, lower-cased,</text>
  <text x="20" y="268" font-size="12" fill="#555">sorted and de-duplicated</text>
  <line x1="245" y1="135" x2="290" y2="135" stroke="#888" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- dictionary rows -->
  <g stroke="#2f8f4e" stroke-width="2" fill="#e3f6e3">
    <rect x="300" y="40"  width="150" height="36" rx="4"/>
    <rect x="300" y="86"  width="150" height="36" rx="4"/>
    <rect x="300" y="132" width="150" height="36" rx="4"/>
    <rect x="300" y="178" width="150" height="36" rx="4"/>
    <rect x="300" y="224" width="150" height="36" rx="4"/>
    <rect x="300" y="270" width="150" height="36" rx="4"/>
  </g>
  <g font-weight="bold">
    <text x="312" y="63">and</text><text x="312" y="109">cat</text><text x="312" y="155">dog</text>
    <text x="312" y="201">ran</text><text x="312" y="247">sat</text><text x="312" y="293">the</text>
  </g>
  <g font-size="12" fill="#555" text-anchor="end">
    <text x="440" y="63">df=1</text><text x="440" y="109">df=3</text><text x="440" y="155">df=2</text>
    <text x="440" y="201">df=1</text><text x="440" y="247">df=2</text><text x="440" y="293">df=2</text>
  </g>

  <!-- posting lists -->
  <g stroke="#b8860b" stroke-width="2" fill="#fff6d6">
    <!-- and: 3 -->
    <rect x="520" y="43" width="40" height="30" rx="3"/>
    <!-- cat: 1 3 4 -->
    <rect x="520" y="89" width="40" height="30" rx="3"/><rect x="580" y="89" width="40" height="30" rx="3" fill="#ffd9b3" stroke="#c2410c"/><rect x="640" y="89" width="40" height="30" rx="3"/>
    <!-- dog: 2 3 -->
    <rect x="520" y="135" width="40" height="30" rx="3"/><rect x="580" y="135" width="40" height="30" rx="3" fill="#ffd9b3" stroke="#c2410c"/>
    <!-- ran: 4 -->
    <rect x="520" y="181" width="40" height="30" rx="3"/>
    <!-- sat: 1 2 -->
    <rect x="520" y="227" width="40" height="30" rx="3"/><rect x="580" y="227" width="40" height="30" rx="3"/>
    <!-- the: 1 2 -->
    <rect x="520" y="273" width="40" height="30" rx="3"/><rect x="580" y="273" width="40" height="30" rx="3"/>
  </g>
  <g font-weight="bold" text-anchor="middle">
    <text x="540" y="63">3</text>
    <text x="540" y="109">1</text><text x="600" y="109">3</text><text x="660" y="109">4</text>
    <text x="540" y="155">2</text><text x="600" y="155">3</text>
    <text x="540" y="201">4</text>
    <text x="540" y="247">1</text><text x="600" y="247">2</text>
    <text x="540" y="293">1</text><text x="600" y="293">2</text>
  </g>
  <g stroke="#888" stroke-width="1.8" marker-end="url(#a)">
    <line x1="452" y1="58"  x2="516" y2="58"/>
    <line x1="452" y1="104" x2="516" y2="104"/>
    <line x1="452" y1="150" x2="516" y2="150"/>
    <line x1="452" y1="196" x2="516" y2="196"/>
    <line x1="452" y1="242" x2="516" y2="242"/>
    <line x1="452" y1="288" x2="516" y2="288"/>
  </g>

  <!-- query box -->
  <rect x="20" y="332" width="760" height="72" rx="8" fill="#fafafa" stroke="#999" stroke-width="2"/>
  <text x="34" y="356" font-weight="bold">Query: documents containing "cat" AND "dog"</text>
  <text x="34" y="378" font-size="13">1. look up "cat" -> [1, 3, 4]      2. look up "dog" -> [2, 3]      3. intersect the sorted lists</text>
  <text x="34" y="396" font-size="13" fill="#c2410c" font-weight="bold">Result: document 3. No document was scanned; only two short lists were merged.</text>
</svg>
