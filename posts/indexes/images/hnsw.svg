<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>

  <!-- layer bands -->
  <rect x="10" y="20"  width="760" height="100" rx="8" fill="#f4f8ff" stroke="#cdd9ee"/>
  <rect x="10" y="140" width="760" height="110" rx="8" fill="#f2faf3" stroke="#cfe5d3"/>
  <rect x="10" y="270" width="760" height="150" rx="8" fill="#faf5fe" stroke="#e0d3ee"/>
  <g font-size="12" fill="#555" font-weight="bold">
    <text x="20" y="38">Layer 2: few nodes, long hops</text>
    <text x="20" y="158">Layer 1: more nodes, medium hops</text>
    <text x="20" y="288">Layer 0: every vector, short hops</text>
  </g>

  <!-- vertical links between layers -->
  <g stroke="#bbb" stroke-dasharray="3 4" stroke-width="1.5">
    <line x1="140" y1="75" x2="140" y2="380"/>
    <line x1="380" y1="70" x2="380" y2="360"/>
    <line x1="620" y1="80" x2="620" y2="380"/>
    <line x1="300" y1="190" x2="300" y2="385"/>
    <line x1="540" y1="195" x2="540" y2="350"/>
  </g>

  <!-- layer 0 edges -->
  <g stroke="#9a7bb5" stroke-width="1.6">
    <polyline fill="none" points="60,355 140,380 220,350 300,385 380,360 460,385 540,350 620,380 700,355"/>
    <line x1="60"  y1="355" x2="220" y2="350"/>
    <line x1="220" y1="350" x2="380" y2="360"/>
    <line x1="380" y1="360" x2="540" y2="350"/>
    <line x1="540" y1="350" x2="700" y2="355"/>
  </g>
  <!-- layer 1 edges -->
  <g stroke="#6aaa7c" stroke-width="1.8">
    <polyline fill="none" points="140,200 300,190 380,210 540,195 620,205"/>
  </g>
  <!-- layer 2 edges -->
  <g stroke="#4a78c2" stroke-width="2">
    <polyline fill="none" points="140,75 380,70 620,80"/>
  </g>

  <!-- search path (orange) -->
  <g stroke="#c2410c" stroke-width="3.5" fill="none" marker-end="url(#o)">
    <line x1="154" y1="74" x2="364" y2="71"/>
    <line x1="394" y1="71" x2="604" y2="79"/>
    <line x1="620" y1="95" x2="620" y2="190"/>
    <line x1="606" y1="204" x2="556" y2="196"/>
    <line x1="540" y1="210" x2="540" y2="334"/>
  </g>

  <!-- layer 2 nodes -->
  <g fill="#e6f0ff" stroke="#4a78c2" stroke-width="2.5">
    <circle cx="140" cy="75" r="14"/><circle cx="380" cy="70" r="14"/><circle cx="620" cy="80" r="14"/>
  </g>
  <!-- layer 1 nodes -->
  <g fill="#e3f6e3" stroke="#2f8f4e" stroke-width="2.5">
    <circle cx="140" cy="200" r="13"/><circle cx="300" cy="190" r="13"/><circle cx="380" cy="210" r="13"/>
    <circle cx="540" cy="195" r="13"/><circle cx="620" cy="205" r="13"/>
  </g>
  <!-- layer 0 nodes -->
  <g fill="#f1e6fb" stroke="#7b3fb5" stroke-width="2">
    <circle cx="60"  cy="355" r="11"/><circle cx="140" cy="380" r="11"/><circle cx="220" cy="350" r="11"/>
    <circle cx="300" cy="385" r="11"/><circle cx="380" cy="360" r="11"/><circle cx="460" cy="385" r="11"/>
    <circle cx="620" cy="380" r="11"/><circle cx="700" cy="355" r="11"/>
    <circle cx="540" cy="350" r="11" fill="#ffd9b3" stroke="#c2410c" stroke-width="3"/>
  </g>

  <!-- entry point and query -->
  <text x="140" y="104" text-anchor="middle" font-size="12" fill="#4a78c2" font-weight="bold">entry point</text>
  <circle cx="585" cy="318" r="8" fill="#c2410c"/>
  <text x="600" y="314" font-size="13" font-weight="bold" fill="#c2410c">query</text>
  <line x1="585" y1="318" x2="548" y2="342" stroke="#c2410c" stroke-width="2" stroke-dasharray="4 3"/>

  <text x="390" y="446" text-anchor="middle" font-size="13" fill="#444">Greedy rule: hop to whichever neighbour is closer to the query; when none is closer, drop one layer.</text>
  <text x="390" y="464" text-anchor="middle" font-size="13" fill="#444">Orange path: 2 hops in layer 2, 1 hop in layer 1, then the best node in layer 0 is the answer.</text>
</svg>
