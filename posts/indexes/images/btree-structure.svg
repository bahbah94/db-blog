<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="sib" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <!-- tree edges -->
  <g stroke="#4a78c2" stroke-width="1.8" fill="none">
    <line x1="315" y1="72" x2="150" y2="130"/>
    <line x1="355" y1="72" x2="520" y2="130"/>
    <line x1="130" y1="162" x2="70"  y2="250"/>
    <line x1="170" y1="162" x2="230" y2="250"/>
    <line x1="500" y1="162" x2="420" y2="250"/>
    <line x1="540" y1="162" x2="620" y2="250"/>
  </g>

  <!-- edge labels -->
  <g font-size="12" fill="#555">
    <text x="215" y="98">keys &lt; 20</text>
    <text x="415" y="98">keys &#8805; 20</text>
    <text x="68"  y="200">&lt; 10</text>
    <text x="185" y="200">&#8805; 10</text>
    <text x="432" y="200">&lt; 35</text>
    <text x="580" y="200">&#8805; 35</text>
  </g>

  <!-- root -->
  <rect x="315" y="40" width="40" height="32" rx="4" fill="#e6f0ff" stroke="#4a78c2" stroke-width="2"/>
  <text x="335" y="61" text-anchor="middle" font-weight="bold">20</text>

  <!-- inner nodes -->
  <rect x="130" y="130" width="40" height="32" rx="4" fill="#e6f0ff" stroke="#4a78c2" stroke-width="2"/>
  <text x="150" y="151" text-anchor="middle" font-weight="bold">10</text>
  <rect x="500" y="130" width="40" height="32" rx="4" fill="#e6f0ff" stroke="#4a78c2" stroke-width="2"/>
  <text x="520" y="151" text-anchor="middle" font-weight="bold">35</text>

  <!-- leaf 1: 3 6 -->
  <g stroke="#2f8f4e" stroke-width="2">
    <rect x="30"  y="250" width="40" height="32" fill="#e3f6e3"/>
    <rect x="70"  y="250" width="40" height="32" fill="#e3f6e3"/>
  </g>
  <text x="50"  y="271" text-anchor="middle" font-weight="bold">3</text>
  <text x="90"  y="271" text-anchor="middle" font-weight="bold">6</text>
  <g stroke="#b8860b" stroke-width="1.5" fill="#fff6d6">
    <rect x="30" y="282" width="40" height="22"/>
    <rect x="70" y="282" width="40" height="22"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#7a5c00">
    <text x="50" y="297">rid</text><text x="90" y="297">rid</text>
  </g>

  <!-- leaf 2: 10 15 -->
  <g stroke="#2f8f4e" stroke-width="2">
    <rect x="190" y="250" width="40" height="32" fill="#e3f6e3"/>
    <rect x="230" y="250" width="40" height="32" fill="#e3f6e3"/>
  </g>
  <text x="210" y="271" text-anchor="middle" font-weight="bold">10</text>
  <text x="250" y="271" text-anchor="middle" font-weight="bold">15</text>
  <g stroke="#b8860b" stroke-width="1.5" fill="#fff6d6">
    <rect x="190" y="282" width="40" height="22"/>
    <rect x="230" y="282" width="40" height="22"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#7a5c00">
    <text x="210" y="297">rid</text><text x="250" y="297">rid</text>
  </g>

  <!-- leaf 3: 20 31 -->
  <g stroke="#2f8f4e" stroke-width="2">
    <rect x="380" y="250" width="40" height="32" fill="#e3f6e3"/>
    <rect x="420" y="250" width="40" height="32" fill="#e3f6e3"/>
  </g>
  <text x="400" y="271" text-anchor="middle" font-weight="bold">20</text>
  <text x="440" y="271" text-anchor="middle" font-weight="bold">31</text>
  <g stroke="#b8860b" stroke-width="1.5" fill="#fff6d6">
    <rect x="380" y="282" width="40" height="22"/>
    <rect x="420" y="282" width="40" height="22"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#7a5c00">
    <text x="400" y="297">rid</text><text x="440" y="297">rid</text>
  </g>

  <!-- leaf 4: 35 38 44 -->
  <g stroke="#2f8f4e" stroke-width="2">
    <rect x="560" y="250" width="40" height="32" fill="#e3f6e3"/>
    <rect x="600" y="250" width="40" height="32" fill="#e3f6e3"/>
    <rect x="640" y="250" width="40" height="32" fill="#e3f6e3"/>
  </g>
  <text x="580" y="271" text-anchor="middle" font-weight="bold">35</text>
  <text x="620" y="271" text-anchor="middle" font-weight="bold">38</text>
  <text x="660" y="271" text-anchor="middle" font-weight="bold">44</text>
  <g stroke="#b8860b" stroke-width="1.5" fill="#fff6d6">
    <rect x="560" y="282" width="40" height="22"/>
    <rect x="600" y="282" width="40" height="22"/>
    <rect x="640" y="282" width="40" height="22"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#7a5c00">
    <text x="580" y="297">rid</text><text x="620" y="297">rid</text><text x="660" y="297">rid</text>
  </g>

  <!-- sibling pointers -->
  <g stroke="#c2410c" stroke-width="2.5" fill="none" marker-end="url(#sib)">
    <line x1="112" y1="266" x2="186" y2="266"/>
    <line x1="272" y1="266" x2="376" y2="266"/>
    <line x1="462" y1="266" x2="556" y2="266"/>
  </g>
  <text x="258" y="244" font-size="12" fill="#c2410c" text-anchor="middle">sibling pointers</text>

  <!-- legend -->
  <rect x="30" y="330" width="16" height="14" fill="#e6f0ff" stroke="#4a78c2" stroke-width="2"/>
  <text x="54" y="342" font-size="13">inner node: separator keys only, they just route the search</text>
  <rect x="430" y="330" width="16" height="14" fill="#e3f6e3" stroke="#2f8f4e" stroke-width="2"/>
  <text x="454" y="342" font-size="13">leaf: real keys + values</text>
  <rect x="610" y="330" width="16" height="14" fill="#fff6d6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="634" y="342" font-size="13">rid = record id</text>
</svg>
