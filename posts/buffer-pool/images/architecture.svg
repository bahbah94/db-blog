<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Memory -->
  <rect x="20" y="20" width="420" height="410" rx="12" fill="#f4f8ff" stroke="#4a78c2" stroke-width="2"/>
  <text x="40" y="46" font-weight="bold" fill="#2b4f8c" font-size="16">MEMORY (fast, small, volatile)</text>

  <rect x="60" y="70" width="340" height="60" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="230" y="106" text-anchor="middle" font-weight="bold">Execution engine</text>

  <rect x="60" y="210" width="340" height="190" rx="8" fill="#e6f0ff" stroke="#4a78c2" stroke-width="1.5"/>
  <text x="230" y="234" text-anchor="middle" font-weight="bold">Buffer pool</text>

  <rect x="75"  y="255" width="68" height="70" rx="6" fill="#fff" stroke="#888"/>
  <rect x="152" y="255" width="68" height="70" rx="6" fill="#ffe8a8" stroke="#c28a00" stroke-width="2"/>
  <rect x="229" y="255" width="68" height="70" rx="6" fill="#fff" stroke="#888"/>
  <rect x="306" y="255" width="68" height="70" rx="6" fill="#fff" stroke="#888"/>
  <text x="109" y="345" text-anchor="middle" font-size="12" fill="#555">frame 0</text>
  <text x="186" y="345" text-anchor="middle" font-size="12" fill="#555">frame 1</text>
  <text x="263" y="345" text-anchor="middle" font-size="12" fill="#555">frame 2</text>
  <text x="340" y="345" text-anchor="middle" font-size="12" fill="#555">frame 3</text>
  <text x="186" y="295" text-anchor="middle" font-weight="bold">page 2</text>
  <text x="109" y="295" text-anchor="middle" fill="#aaa">empty</text>
  <text x="263" y="295" text-anchor="middle" fill="#aaa">empty</text>
  <text x="340" y="295" text-anchor="middle" fill="#aaa">empty</text>
  <text x="230" y="380" text-anchor="middle" font-size="12" fill="#555">page table: { page 2 -> frame 1 }</text>

  <!-- Disk -->
  <rect x="520" y="20" width="340" height="410" rx="12" fill="#f6f6f6" stroke="#777" stroke-width="2"/>
  <text x="540" y="46" font-weight="bold" fill="#444" font-size="16">DISK (slow, big, durable)</text>

  <rect x="560" y="70" width="260" height="44" rx="6" fill="#fff" stroke="#333"/>
  <text x="690" y="98" text-anchor="middle">Directory (page id -> file offset)</text>

  <rect x="560" y="140" width="260" height="40" rx="6" fill="#fff" stroke="#888"/>
  <text x="690" y="165" text-anchor="middle">page 1</text>
  <rect x="560" y="188" width="260" height="40" rx="6" fill="#ffe8a8" stroke="#c28a00" stroke-width="2"/>
  <text x="690" y="213" text-anchor="middle" font-weight="bold">page 2</text>
  <rect x="560" y="236" width="260" height="40" rx="6" fill="#fff" stroke="#888"/>
  <text x="690" y="261" text-anchor="middle">page 3</text>
  <rect x="560" y="284" width="260" height="40" rx="6" fill="#fff" stroke="#888"/>
  <text x="690" y="309" text-anchor="middle">page 4</text>
  <rect x="560" y="332" width="260" height="40" rx="6" fill="#fff" stroke="#888"/>
  <text x="690" y="357" text-anchor="middle">page 5</text>
  <text x="690" y="400" text-anchor="middle" font-size="12" fill="#555">database file</text>

  <!-- Arrows -->
  <line x1="190" y1="130" x2="190" y2="208" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="180" y="176" text-anchor="end" font-size="13">1. "give me page 2"</text>

  <line x1="270" y1="208" x2="270" y2="132" stroke="#2a8a3a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="280" y="176" font-size="13" fill="#2a8a3a">3. pointer to frame</text>

  <line x1="400" y1="290" x2="558" y2="214" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#arr)"/>
  <text x="470" y="262" font-size="13" fill="#c2410c">2. copy from disk</text>
  <text x="470" y="278" font-size="12" fill="#c2410c">(only on a miss)</text>
</svg>
