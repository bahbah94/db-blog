<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="40" y="34" font-weight="bold" font-size="16">Page table</text>
  <text x="40" y="52" font-size="12" fill="#555">in-memory hash map, guarded by a latch</text>

  <text x="400" y="34" font-weight="bold" font-size="16">Buffer pool frames + per-frame metadata</text>

  <!-- page table rows -->
  <rect x="40" y="70"  width="230" height="46" rx="6" fill="#eef7ee" stroke="#2a8a3a"/>
  <text x="155" y="98" text-anchor="middle">page 1  ->  frame 0</text>
  <rect x="40" y="140" width="230" height="46" rx="6" fill="#eef7ee" stroke="#2a8a3a"/>
  <text x="155" y="168" text-anchor="middle">page 3  ->  frame 1</text>
  <rect x="40" y="280" width="230" height="46" rx="6" fill="#eef7ee" stroke="#2a8a3a"/>
  <text x="155" y="308" text-anchor="middle">page 2  ->  frame 3</text>
  <text x="155" y="236" text-anchor="middle" fill="#888">frame 2 is free,</text>
  <text x="155" y="254" text-anchor="middle" fill="#888">so no entry points to it</text>

  <!-- frames -->
  <rect x="400" y="62" width="320" height="62" rx="6" fill="#e6f0ff" stroke="#4a78c2"/>
  <text x="414" y="84" font-weight="bold">frame 0: page 1</text>
  <text x="414" y="106" font-size="12" fill="#444">dirty = no    pin_count = 0    last_access = t4</text>

  <rect x="400" y="132" width="320" height="62" rx="6" fill="#ffe8e0" stroke="#c2410c"/>
  <text x="414" y="154" font-weight="bold">frame 1: page 3</text>
  <text x="414" y="176" font-size="12" fill="#444">dirty = YES   pin_count = 1    last_access = t9</text>

  <rect x="400" y="202" width="320" height="62" rx="6" fill="#fafafa" stroke="#bbb" stroke-dasharray="5 4"/>
  <text x="414" y="228" fill="#999" font-weight="bold">frame 2: (free)</text>

  <rect x="400" y="272" width="320" height="62" rx="6" fill="#e6f0ff" stroke="#4a78c2"/>
  <text x="414" y="294" font-weight="bold">frame 3: page 2</text>
  <text x="414" y="316" font-size="12" fill="#444">dirty = no    pin_count = 2    last_access = t7</text>

  <line x1="270" y1="93"  x2="398" y2="93"  stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="270" y1="163" x2="398" y2="163" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="270" y1="303" x2="398" y2="303" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="400" y="362" font-size="12" fill="#555">pinned frames (pin_count &gt; 0) can never be evicted; dirty frames must be written first</text>
</svg>
