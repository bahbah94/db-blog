<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 545" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14">
  <!-- PANEL 1: exact counts -->
  <text x="20" y="24" font-weight="bold" fill="#555">1. Exact: one counter per value (15 values, 45 rows)</text>
  <line x1="56" y1="150" x2="604" y2="150" stroke="#999" stroke-width="1.5"/>
  <g stroke="#4a78c2" stroke-width="1.5" fill="#e6f0ff">
    <rect x="60" y="126" width="32" height="24"/><rect x="96" y="126" width="32" height="24"/><rect x="132" y="102" width="32" height="48"/>
    <rect x="168" y="126" width="32" height="24"/><rect x="204" y="126" width="32" height="24"/><rect x="240" y="126" width="32" height="24"/>
    <rect x="276" y="126" width="32" height="24"/><rect x="312" y="54" width="32" height="96"/>
    <rect x="348" y="102" width="32" height="48" fill="#ffd9b3" stroke="#c2410c" stroke-width="2"/>
    <rect x="384" y="138" width="32" height="12"/><rect x="420" y="138" width="32" height="12"/><rect x="456" y="138" width="32" height="12"/>
    <rect x="492" y="126" width="32" height="24"/><rect x="528" y="102" width="32" height="48"/><rect x="564" y="54" width="32" height="96"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#444">
    <text x="76" y="166">1</text><text x="112" y="166">2</text><text x="148" y="166">3</text><text x="184" y="166">4</text><text x="220" y="166">5</text>
    <text x="256" y="166">6</text><text x="292" y="166">7</text><text x="328" y="166">8</text><text x="364" y="166" font-weight="bold" fill="#c2410c">9</text><text x="400" y="166">10</text>
    <text x="436" y="166">11</text><text x="472" y="166">12</text><text x="508" y="166">13</text><text x="544" y="166">14</text><text x="580" y="166">15</text>
  </g>
  <text x="364" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2410c">4</text>
  <text x="328" y="48" text-anchor="middle" font-size="12" font-weight="bold">8</text>
  <text x="580" y="48" text-anchor="middle" font-size="12" font-weight="bold">8</text>
  <g font-size="12" fill="#333">
    <text x="625" y="80">Exact answers, but the</text><text x="625" y="96">statistics grow with the</text><text x="625" y="112">number of distinct values.</text>
    <text x="625" y="136" fill="#c2410c">Orange: how many rows</text><text x="625" y="152" fill="#c2410c">have value 9? Exactly 4.</text>
  </g>

  <!-- PANEL 2: equi-depth -->
  <text x="20" y="214" font-weight="bold" fill="#555">2. Equi-depth: buckets hold about the same number of rows</text>
  <line x1="56" y1="340" x2="604" y2="340" stroke="#999" stroke-width="1.5"/>
  <g stroke="#2f8f4e" stroke-width="2" fill="#e3f6e3">
    <rect x="60" y="244" width="176" height="96"/><rect x="240" y="244" width="104" height="96"/><rect x="348" y="268" width="176" height="72"/><rect x="528" y="244" width="68" height="96"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="bold">
    <text x="148" y="298">12</text><text x="292" y="298">12</text><text x="436" y="310">9</text><text x="562" y="298">12</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#444">
    <text x="148" y="357">values 1 to 5</text><text x="292" y="357">6 to 8</text><text x="436" y="357">9 to 13</text><text x="562" y="357">14 to 15</text>
  </g>
  <g font-size="12" fill="#333">
    <text x="625" y="280">Only 4 numbers plus the</text><text x="625" y="296">bucket edges are stored.</text>
    <text x="625" y="320" fill="#c2410c">Value 9 sits in a bucket of</text><text x="625" y="336" fill="#c2410c">9 rows over 5 values, so we</text><text x="625" y="352" fill="#c2410c">guess 9/5 = 1.8 (true: 4).</text>
  </g>

  <!-- PANEL 3: end-biased -->
  <text x="20" y="394" font-weight="bold" fill="#555">3. End-biased: exact counts for the most frequent values, one average for the rest</text>
  <line x1="56" y1="510" x2="604" y2="510" stroke="#999" stroke-width="1.5"/>
  <g stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" fill="#f2f2f2">
    <rect x="60" y="490" width="32" height="20"/><rect x="96" y="490" width="32" height="20"/><rect x="168" y="490" width="32" height="20"/><rect x="204" y="490" width="32" height="20"/>
    <rect x="240" y="490" width="32" height="20"/><rect x="276" y="490" width="32" height="20"/><rect x="384" y="490" width="32" height="20"/><rect x="420" y="490" width="32" height="20"/>
    <rect x="456" y="490" width="32" height="20"/><rect x="492" y="490" width="32" height="20"/>
  </g>
  <g stroke="#7b3fb5" stroke-width="2" fill="#f1e6fa">
    <rect x="132" y="462" width="32" height="48"/><rect x="312" y="414" width="32" height="96"/><rect x="348" y="462" width="32" height="48"/>
    <rect x="528" y="462" width="32" height="48"/><rect x="564" y="414" width="32" height="96"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="bold" fill="#7b3fb5">
    <text x="148" y="456">4</text><text x="328" y="408">8</text><text x="364" y="456">4</text><text x="544" y="456">4</text><text x="580" y="408">8</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#444">
    <text x="76" y="526">1</text><text x="112" y="526">2</text><text x="148" y="526">3</text><text x="184" y="526">4</text><text x="220" y="526">5</text>
    <text x="256" y="526">6</text><text x="292" y="526">7</text><text x="328" y="526">8</text><text x="364" y="526">9</text><text x="400" y="526">10</text>
    <text x="436" y="526">11</text><text x="472" y="526">12</text><text x="508" y="526">13</text><text x="544" y="526">14</text><text x="580" y="526">15</text>
  </g>
  <g font-size="12" fill="#333">
    <text x="625" y="440">Purple: the 5 heaviest values</text><text x="625" y="456">are stored exactly.</text>
    <text x="625" y="480" fill="#666">Grey, dashed: all other values</text><text x="625" y="496" fill="#666">share one stored average, 1.7.</text>
  </g>
</svg>
