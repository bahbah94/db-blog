<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker>
  </defs>

  <!-- Pipeline 1 -->
  <rect x="28" y="36" width="372" height="64" rx="8" fill="#fff8f0" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="36" y="28" font-weight="bold" fill="#c2410c">Pipeline 1</text>
  <rect x="44" y="48" width="120" height="40" rx="6" fill="#e6f0ff" stroke="#4a78c2" stroke-width="2"/>
  <text x="104" y="73" text-anchor="middle" font-weight="bold">Scan R</text>
  <line x1="166" y1="68" x2="218" y2="68" stroke="#777" stroke-width="2" marker-end="url(#a)"/>
  <rect x="220" y="48" width="164" height="40" rx="6" fill="#ffd9b3" stroke="#c2410c" stroke-width="2"/>
  <text x="302" y="73" text-anchor="middle" font-weight="bold">Build hash table</text>

  <!-- breaker -->
  <line x1="414" y1="38" x2="414" y2="98" stroke="#c0392b" stroke-width="6"/>
  <text x="430" y="60" font-size="13" font-weight="bold" fill="#c0392b">Pipeline breaker</text>
  <text x="430" y="78" font-size="12" fill="#444">the table must be complete</text>
  <text x="430" y="94" font-size="12" fill="#444">before anyone can probe it</text>

  <!-- Pipeline 2 -->
  <rect x="28" y="156" width="772" height="64" rx="8" fill="#f4f8ff" stroke="#4a78c2" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="36" y="148" font-weight="bold" fill="#4a78c2">Pipeline 2</text>
  <g stroke="#4a78c2" stroke-width="2" fill="#e6f0ff">
    <rect x="44" y="168" width="100" height="40" rx="6"/><rect x="180" y="168" width="150" height="40" rx="6"/>
    <rect x="366" y="168" width="140" height="40" rx="6" fill="#ffd9b3" stroke="#c2410c"/>
    <rect x="542" y="168" width="130" height="40" rx="6"/>
  </g>
  <rect x="708" y="168" width="84" height="40" rx="6" fill="#e3f6e3" stroke="#2f8f4e" stroke-width="2"/>
  <g text-anchor="middle" font-weight="bold" font-size="13">
    <text x="94" y="193">Scan S</text><text x="255" y="193">Filter value&gt;100</text><text x="436" y="193">Probe hash table</text>
    <text x="607" y="193">Project cols</text><text x="750" y="193">Result</text>
  </g>
  <g stroke="#777" stroke-width="2" marker-end="url(#a)">
    <line x1="146" y1="188" x2="178" y2="188"/><line x1="332" y1="188" x2="364" y2="188"/><line x1="508" y1="188" x2="540" y2="188"/><line x1="674" y1="188" x2="706" y2="188"/>
  </g>

  <!-- link -->
  <line x1="302" y1="90" x2="420" y2="166" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="196" y="132" font-size="12" fill="#c2410c">finished table is handed over</text>

  <text x="20" y="250" font-size="13" fill="#444">Inside a pipeline a tuple travels from the scan to the result without being stored anywhere in between.</text>
  <text x="20" y="270" font-size="13" fill="#444">Pipeline 2 cannot start probing until pipeline 1 has seen every tuple of R.</text>
</svg>
